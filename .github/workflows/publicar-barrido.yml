name: Publicar el barrido para la app

# Baja las velas, calcula el barrido y lo deja en `estado/barrido.json` de la
# rama `datos`, que es lo que se baja la app. NO anota señales, NO las juzga y
# NO manda avisos: de eso se encarga el vigía, una vez por hora. Ver el
# comentario de cabecera de app/scripts/publicar-barrido.mjs para el porqué de
# tenerlos separados.
#
# CUOTA: cada corrida gasta 7 créditos de Twelve Data.
#
#   este workflow ... 24 corridas × 7 = 168   (al minuto 5, de lunes a viernes)
#   el vigía ........ 24 corridas × 7 = 168   (al minuto 20)
#   reporte diario ..  1 corrida  × 7 =   7
#   ─────────────────────────────────────────
#   total ...........................   343  de los 800 diarios
#
# Quedan ~457 libres: cabe una corrida a mano del banco de pruebas (28) o
# incluso del M15 (112) sin acercarse al tope.
#
# ⚠️ ESOS 343 SON EL TECHO, NO LO QUE SE GASTA HOY. Lo que se gasta de verdad
# depende de cuántos crones dispare GitHub, y hasta el 2026-10-06 disparaba el
# 21 %: medido sobre 22 días hábiles, este publicador corría 10,1 veces al día
# —no 48— y el vigía 5,0 —no 24—, o sea unos 113 créditos reales al día en vez
# de los 511 que decía este archivo. Desde el 2026-10-06 los dos pasan a 24
# entradas DIARIAS, que es la forma de cron que sí dispara (la tabla medida está
# en la cabecera de `vigia.yml`). Si la predicción se cumple, el gasto real sube
# hacia esos 343; si no se cumple, se queda donde estaba.
#
# 📌 ESTA CUENTA DECÍA 24 CORRIDAS Y 343 CRÉDITOS, y era falsa desde que se
# añadió el segundo horario: el bloque `schedule` de abajo ya decía 48 y 511,
# así que **el archivo se contradecía a sí mismo** 40 líneas más abajo. Y de
# aquí lo copió CLAUDE.md, donde llevaba semanas.
#
# Es otra vez «al cambiar algo, mirar también quién lo NOMBRA»: el cron nuevo se
# añadió y el rótulo que lo describe se quedó atrás. No cambiaba nada práctico,
# pero con el número viejo alguien decidiría creyendo que hay 168 créditos de
# holgura que no existen. Salió el 2026-09-30, calculando si cabía una sonda.
#
# POR QUÉ EN EL MINUTO 5: la vela de una hora cierra en punto, así que el
# minuto 5 es lo primero que se puede publicar con la vela ya cerrada. Y el
# vigía corre al minuto 20, de modo que las dos tareas no se pisan: cada barrido
# gasta 7 de los 8 créditos por minuto que da el plan gratuito.
#
# Ver el bloque `schedule` de abajo para los números que justifican la forma de
# los crones.

on:
  schedule:
    # ⚠️⚠️ VEINTICUATRO ENTRADAS DIARIAS, NO DOS HORARIAS (desde el 2026-10-06)
    #
    # Aquí había `5 * * * 1-5` y `35 * * * 1-5`, o sea 48 disparos al día. De
    # esos 48 GitHub disparaba **222 de 1.056 en 22 días hábiles: el 21 %**, o
    # sea 10,1 publicaciones al día en vez de 48.
    #
    # Lo que decide el arreglo está medido: el porcentaje que dispara NO depende
    # de cuántos disparos tenga el workflow al día, sino de cada cuánto dispara
    # CADA entrada. Una entrada que dispara una vez al día acierta el ~95 %; una
    # que dispara cada hora, el 21 %. La tabla completa está en la cabecera de
    # `vigia.yml`.
    #
    # 📌 Y la prueba de que el freno es por ENTRADA y no por workflow la daban
    # estos dos crones: con el DOBLE de entradas que el vigía, este publicador
    # iba al mismo 21 % por entrada y justo al doble en total (10,1 contra 5,0).
    # Si el freno fuera por disparos totales, con 48 habría ido peor que con 24.
    #
    # Se pasa a 24 entradas diarias —UNA por hora, no dos— y no a 48. Una
    # publicación por hora que de verdad ocurra vale más que dos que no: la app
    # calcula sobre velas de una hora YA CERRADAS, y ésas no se mueven. Lo único
    # que se pierde frente a dos por hora es el precio de la hora en curso.
    #
    # ⚠️ Lo que ya NO vale de la nota anterior: decía que el vigía y este
    # publicador fallaban de forma INDEPENDIENTE, y por eso sumar horarios
    # ayudaba. Sigue siendo cierto y deja de hacer falta — con entradas diarias
    # la redundancia entre workflows ya no es lo que sostiene la cobertura.
    - cron: '5 0 * * 1-5'
    - cron: '5 1 * * 1-5'
    - cron: '5 2 * * 1-5'
    - cron: '5 3 * * 1-5'
    - cron: '5 4 * * 1-5'
    - cron: '5 5 * * 1-5'
    - cron: '5 6 * * 1-5'
    - cron: '5 7 * * 1-5'
    - cron: '5 8 * * 1-5'
    - cron: '5 9 * * 1-5'
    - cron: '5 10 * * 1-5'
    - cron: '5 11 * * 1-5'
    - cron: '5 12 * * 1-5'
    - cron: '5 13 * * 1-5'
    - cron: '5 14 * * 1-5'
    - cron: '5 15 * * 1-5'
    - cron: '5 16 * * 1-5'
    - cron: '5 17 * * 1-5'
    - cron: '5 18 * * 1-5'
    - cron: '5 19 * * 1-5'
    - cron: '5 20 * * 1-5'
    - cron: '5 21 * * 1-5'
    - cron: '5 22 * * 1-5'
    - cron: '5 23 * * 1-5'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Correr aunque esta hora ya se haya publicado (el guardián de la hora)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Comparte grupo con el vigía a propósito: los dos escriben el mismo archivo
  # en la misma rama, así que no deben correr a la vez.
  group: vigia
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Lo normal son unos 20 segundos; con reintentos por el límite de consultas
    # por minuto de Twelve Data, un par de minutos. El tope es la red de
    # seguridad para cualquier cuelgue no previsto: sin él GitHub deja correr
    # un trabajo hasta 6 horas, y como `concurrency` no cancela el anterior,
    # uno atascado bloquearía también al vigía.
    timeout-minutes: 8
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Traer los datos
        uses: actions/checkout@v4
        with:
          ref: datos
          path: datos

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No hace falta `npm ci`: este guion no usa ningún paquete (los avisos al
      # celular, que son los que necesitan `web-push`, los manda el vigía). Sin
      # instalar nada, la corrida tarda segundos en vez de medio minuto, y son
      # 24 corridas al día.

      - name: Publicar
        working-directory: app
        env:
          VIGIA_DATOS: ${{ github.workspace }}/datos
          # Si el secreto está puesto, se usa; si no, `velas.mjs` se cae a la
          # clave de .env.production. Ver el comentario de `leerLlave`.
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          # ⚠️ EL GUARDIÁN DE LA HORA — el mismo que el del vigía, y por el
          # mismo motivo: desde el 2026-10-06 hay DOS relojes pulsando este
          # botón (los crones de GitHub y el reloj de fuera en Cloudflare), y sin
          # esto serían 329 créditos de los 800 en vez de 168.
          #
          # `'0' || '1'` y no `'' || '1'`: una cadena vacía es FALSA en las
          # expresiones de GitHub, así que con `''` forzar no forzaría nada.
          SOLO_SI_FALTA_LA_HORA: ${{ inputs.forzar && '0' || '1' }}
        run: node scripts/publicar-barrido.mjs

      - name: Guardar
        working-directory: datos
        run: |
          git config user.name 'Vigía Nestor Forex'
          git config user.email 'noreply@anthropic.com'
          git add estado
          if git diff --cached --quiet; then
            echo 'Sin cambios que guardar.'
            exit 0
          fi
          git commit -m "Barrido $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Si el vigía escribió mientras tanto, se reintenta encima de lo suyo
          # en vez de pisarlo.
          for i in 1 2 3; do
            git pull --rebase origin datos && git push origin HEAD:datos && exit 0
            sleep $((i * 5))
          done
          echo 'No se pudo guardar tras 3 intentos.'
          exit 1
