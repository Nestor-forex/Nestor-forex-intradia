name: Diagnóstico temporal de TrueFX

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probar conexión a TrueFX
        working-directory: app
        run: node scripts/debug-truefx.mjs
