name: Vigía por hora

# Revisa el barrido cada hora y anota las señales nuevas. Ver el comentario
# de cabecera de app/scripts/vigia.mjs para el porqué.
#
# Cuota: cada revisión gasta 7 créditos de Twelve Data. 24 al día son 168 de
# los 800 diarios del plan gratuito, así que cabe junto con el reporte diario
# y alguna corrida a mano de comparar-reglas.
#
# Los datos NO se guardan en esta rama: van a la rama `datos`, para que el
# historial del código no quede sepultado bajo 24 commits diarios.

on:
  schedule:
    # Al minuto 20 de cada hora, de lunes a viernes (el mercado Forex está
    # cerrado el fin de semana). NO en punto a propósito: el reporte diario
    # sale a las 13:00 y cada barrido gasta 7 de los 8 créditos por minuto que
    # da Twelve Data, así que si coincidieran uno de los dos se quedaría sin
    # datos. (De todos modos velas.mjs reintenta si le toca un 429.)
    #
    # Ojo: el reloj de GitHub es impuntual y a veces se atrasa; el propio
    # vigía anota a qué minuto corrió de verdad para poder medirlo.
    - cron: '20 * * * 1-5'
  workflow_dispatch:

# El vigía escribe en la rama `datos`, así que necesita permiso de escritura:
# por defecto el token de Actions es de solo lectura.
permissions:
  contents: write

concurrency:
  # Que no se pisen dos revisiones a la vez escribiendo los mismos archivos.
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    # La red de seguridad final. Los límites que hay dentro del código cubren
    # cada llamada por separado, pero esto cubre CUALQUIER cuelgue, incluidos
    # los que no hemos previsto. Sin él, GitHub deja correr un trabajo hasta
    # 6 horas, y como aquí `concurrency` no cancela la corrida anterior, una
    # sola atascada dejaría al vigía sin vigilar media jornada.
    # Lo normal son 15 segundos; con reintentos por el límite de Twelve Data,
    # unos 2 minutos y medio.
    timeout-minutes: 10
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Traer los datos
        uses: actions/checkout@v4
        with:
          ref: datos
          path: datos

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Con la caché, instalar tarda segundos en vez de medio minuto. Es
          # lo que hace que valga la pena instalar 24 veces al día.
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Hasta la fase 3 el vigía no instalaba nada: le bastaba Node pelado.
      # Ahora necesita `web-push` para mandar los avisos al celular.
      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Revisar
        working-directory: app
        env:
          VIGIA_DATOS: ${{ github.workspace }}/datos
          # Los avisos al celular. Si estos dos secretos no están puestos, el
          # vigía sigue funcionando igual y solo anota que no pudo avisar: la
          # parte que no se puede perder es el historial de señales.
          #
          # La clave PÚBLICA no va aquí: se lee de src/lib/push/vapid.js, para
          # que la app y el vigía usen exactamente la misma y no puedan
          # desincronizarse.
          # La llave de Twelve Data. Si el secreto no está puesto, velas.mjs
          # se cae a la de .env.production y todo sigue igual.
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/vigia.mjs

      - name: Guardar lo que vio
        working-directory: datos
        run: |
          git config user.name 'Vigía Nestor Forex'
          git config user.email 'noreply@anthropic.com'
          git add estado historial
          if git diff --cached --quiet; then
            echo 'Sin cambios que guardar.'
            exit 0
          fi
          git commit -m "Vigía $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Si otra corrida escribió mientras tanto, se reintenta encima de lo
          # suyo en vez de pisarlo.
          for i in 1 2 3; do
            git pull --rebase origin datos && git push origin HEAD:datos && exit 0
            sleep $((i * 5))
          done
          echo 'No se pudo guardar tras 3 intentos.'
          exit 1
